name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - run: go test ./...
      - name: Build MGL03 binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
        run: go build -trimpath -ldflags "-s -w" -o bin/mgl03-homekit-bridge ./cmd/mgl03-homekit-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: mgl03-homekit-bridge-linux-mipsle
          path: bin/mgl03-homekit-bridge
