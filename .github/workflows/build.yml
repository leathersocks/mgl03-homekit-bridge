name: build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./...
      - run: go vet ./...
      - name: Test no-Telnet installer
        run: python3 -m unittest discover -s tests -v
      - name: Check device shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck --severity=error scripts/*.sh
      - name: Build MGL03 binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
        run: |
          go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o bin/mgl03-homekit-bridge ./cmd/mgl03-homekit-bridge
          test "$(stat -c%s bin/mgl03-homekit-bridge)" -lt 12000000
          sha256sum bin/mgl03-homekit-bridge > bin/mgl03-homekit-bridge.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mgl03-homekit-bridge-linux-mipsle
          path: |
            bin/mgl03-homekit-bridge
            bin/mgl03-homekit-bridge.sha256
